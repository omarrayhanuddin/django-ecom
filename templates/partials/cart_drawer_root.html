{% comment %}
Cart drawer root.

The <aside> is a permanent shell; only its inner body is swapped by HTMX, so the
Alpine open/close state and the backdrop are never destroyed by a cart refresh.
{% endcomment %}
<div id="cart-drawer-root"
     x-data="{ open: false }"
     @opencart.window="open = true"
     @closecart.window="open = false"
     @keydown.escape.window="open = false">
  <div class="cart-drawer-backdrop" x-show="open" x-cloak @click="open = false"></div>
  <aside class="cart-drawer p-3" x-show="open" x-cloak aria-label="কার্ট">
    <div id="cart-drawer-body"
         hx-get="{% url 'cart:panel' %}"
         hx-trigger="opencart from:body"
         hx-target="this"
         hx-swap="innerHTML">
      <div class="text-center text-muted-c py-5">লোড হচ্ছে...</div>
    </div>
  </aside>
</div>

{% extends 'base.html' %}
{% block title %}ভিজিটর পরিসংখ্যান — ShopBazar{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1 class="section-title mb-4">ভিজিটর পরিসংখ্যান</h1>
  <div class="row g-3">
    <div class="col-md-6">
      <div class="card"><div class="card-body text-center">
        <div class="text-muted-c">মোট ভিজিটর</div>
        <div class="product-price fs-2">{{ total_visits }}</div>
      </div></div>
    </div>
    <div class="col-md-6">
      <div class="card"><div class="card-body text-center">
        <div class="text-muted-c"><span class="live-dot me-1"></span>এখন অনলাইন</div>
        <div class="product-price fs-2" data-live-count
             hx-get="{% url 'analytics:live_count' %}" hx-trigger="every 30s" hx-swap="innerHTML">{{ live_count }}</div>
      </div></div>
    </div>
  </div>
</div>
{% endblock %}

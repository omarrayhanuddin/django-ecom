[project]
name = "shopbazar"
version = "0.1.0"
description = "Bilingual Bangladeshi retail e-commerce storefront (Django 5, HTMX, Channels)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.0",
    "django>=5.0,<6.0",
    "django-admin-sortable2>=2.3.1",
    "django-allauth[socialaccount]>=65.5",
    "django-celery-beat>=2.9.0",
    "django-ckeditor>=6.7.3",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "django-htmx>=1.29.0",
    "django-imagekit>=6.1.1",
    "django-import-export>=4.4.1",
    "django-ratelimit>=4.1.0",
    "django-redis>=7.0.0",
    "django-solo>=2.5.1",
    "django-unfold>=0.108.0",
    "gunicorn>=26.2.0",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

{% extends 'base.html' %}
{% block title %}ঠিকানা মুছুন — ShopBazar{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card"><div class="card-body">
        <h1 class="section-title mb-3">ঠিকানা মুছে ফেলবেন?</h1>
        <p>{{ object }}</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-brand">হ্যাঁ, মুছুন</button>
          <a href="{% url 'accounts:addresses' %}" class="btn btn-outline-brand">বাতিল</a>
        </form>
      </div></div>
    </div>
  </div>
</div>
{% endblock %}
